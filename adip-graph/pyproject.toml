[project]
name = "adip-graph"
version = "0.1.0"
description = "ADIP Python sidecar — LangGraph workflow execution + vLLM driver."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  # LangGraph and vLLM are heavy installs. Mark as optional extras so
  # commercial-only deployments can skip them.
]

[project.optional-dependencies]
graph = ["langgraph>=0.2"]
vllm = ["vllm>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
